version: "2"
sql:
  - engine: "postgresql"
    schema: "db-migrations/versions"
    queries: "internal/adapter/out/sqlcdb/query"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/adapter/out/sqlcdb/gen"
        sql_package: "database/sql"
        emit_interface: true
        emit_pointers_for_null_types: true
        rename:
          avatar_url: "AvatarURL"
        overrides:
          - db_type: "pg_catalog.varchar"
            nullable: true
            go_type:
              type: "string"
              pointer: true
