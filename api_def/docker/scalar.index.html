<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scalar API Reference</title>
    <style>html,body,#app{height:100%;margin:0;padding:0}</style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: '/openapi.yaml',
        layout: 'modern',
        theme: 'purple',
        servers: [
          {
            url: '/api',
            description: 'Local Proxy to Prism Mock Server'
          }
        ]
      });
    </script>
  </body>
  </html>
