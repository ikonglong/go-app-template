server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Emit relative redirects so the mapped host port (e.g. :8010) is preserved
  # instead of nginx rebuilding an absolute URL on port 80.
  absolute_redirect off;

  # Serve UI
  location = / {
    return 302 /index.html;
  }
  location = /index.html { try_files /index.html =404; }

  # Serve local spec
  location = /openapi.yaml { try_files /openapi.yaml =404; }

  # Proxy API calls to Prism (same-origin to avoid CORS)
  location /api/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
      add_header Access-Control-Allow-Headers *;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Expose-Headers * always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://prism_upstream;
  }
}

upstream prism_upstream { server prism:4010; }
