openapi: 3.1.1
info:
  title: APIService
  version: 1.0.0
security:
  - smithy.api.httpBearerAuth: []
paths:
  /api/v1/characters:
    get:
      description: Mixin attaching the standard 4xx/5xx error responses to an operation.
      operationId: ListCharacters
      parameters:
        - name: limit
          in: query
          description: |-
            This specifies a limit on the number of objects to return, ranging
            between 1 and 100.
          schema:
            type: integer
            maximum: 100
            minimum: 1
            description: |-
              This specifies a limit on the number of objects to return, ranging
              between 1 and 100.
            format: int32
        - name: starting_after
          in: query
          description: >-
            An object ID that defines your place in the list. For example, if
            you

            make a list request and receive 100 objects, ending with obj_foo,
            your

            subsequent call can include starting_after=obj_foo to fetch the next

            page of the list.
          schema:
            type: string
            description: >-
              An object ID that defines your place in the list. For example, if
              you

              make a list request and receive 100 objects, ending with obj_foo,
              your

              subsequent call can include starting_after=obj_foo to fetch the
              next

              page of the list.
        - name: ending_before
          in: query
          description: >-
            An object ID that defines your place in the list. For example, if
            you

            make a list request and receive 100 objects, starting with obj_bar,

            your subsequent call can include ending_before=obj_bar to fetch the

            previous page of the list.
          schema:
            type: string
            description: >-
              An object ID that defines your place in the list. For example, if
              you

              make a list request and receive 100 objects, starting with
              obj_bar,

              your subsequent call can include ending_before=obj_bar to fetch
              the

              previous page of the list.
        - name: order
          in: query
          description: |-
            Default sort order.
            Note: Regardless of this parameter, **the returned list is always
            sorted in ascending order by time/ID (oldest to newest).**
            This parameter only determines **the entry point of the initial
            request** (when neither starting_after nor ending_before is
            provided):
            - asc: Start from the beginning of the timeline (oldest). The first
              request returns the oldest N items (e.g. [1, 2, 3]).
            - desc: Start from the end of the timeline (newest). The first
              request returns the newest N items (e.g. [4, 5, 6]).
            Different endpoints may have different default strategies.
          schema:
            $ref: '#/components/schemas/SortOrder'
        - name: gender
          in: query
          description: Optional gender filter
          schema:
            type: string
            description: Optional gender filter
        - name: ethnicity
          in: query
          description: Optional ethnicity filter
          schema:
            type: string
            description: Optional ethnicity filter
        - name: age_group
          in: query
          description: Optional age group filter
          schema:
            type: string
            description: Optional age group filter
        - name: tag
          in: query
          description: >-
            Legacy single-tag filter; prefer repeating `tags` for AND semantics
            (Director).
          schema:
            type: string
            description: >-
              Legacy single-tag filter; prefer repeating `tags` for AND
              semantics (Director).
        - name: scope
          in: query
          description: >-
            `system` = platform presets (default). `user-upload` = current
            user's self-upload digital humans (requires Medeo-User-Id).
          schema:
            $ref: '#/components/schemas/CharacterScope'
        - name: project_id
          in: query
          description: 'When `scope=user-upload`, filter by Medeo project id.'
          schema:
            type: string
            description: 'When `scope=user-upload`, filter by Medeo project id.'
        - name: tags
          in: query
          description: >-
            AND tag filter: repeat query key `tags`, e.g.
            `?tags=country:Italy&tags=occupation:miner`
          style: form
          schema:
            type: array
            items:
              type: string
            description: >-
              AND tag filter: repeat query key `tags`, e.g.
              `?tags=country:Italy&tags=occupation:miner`
          explode: true
      responses:
        '200':
          description: ListCharacters 200 response
          headers:
            Request-Id:
              description: Identifier returned in the `Request-Id` response header.
              schema:
                type: string
                maxLength: 36
                minLength: 36
                pattern: >-
                  ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                description: Identifier returned in the `Request-Id` response header.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCharactersResp'
        '400':
          description: HTTP4xxOutput 400 response
          headers:
            Request-Id:
              description: Identifier returned in the `Request-Id` response header.
              schema:
                type: string
                maxLength: 36
                minLength: 36
                pattern: >-
                  ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                description: Identifier returned in the `Request-Id` response header.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: HTTP5xxOutput 500 response
          headers:
            Request-Id:
              description: Identifier returned in the `Request-Id` response header.
              schema:
                type: string
                maxLength: 36
                minLength: 36
                pattern: >-
                  ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                description: Identifier returned in the `Request-Id` response header.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      tags:
        - Character
    post:
      description: Mixin attaching the standard 4xx/5xx error responses to an operation.
      operationId: CreateCharacter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCharacterReq'
        required: true
      responses:
        '200':
          description: CreateCharacter 200 response
          headers:
            Request-Id:
              description: Identifier returned in the `Request-Id` response header.
              schema:
                type: string
                maxLength: 36
                minLength: 36
                pattern: >-
                  ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                description: Identifier returned in the `Request-Id` response header.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '400':
          description: HTTP4xxOutput 400 response
          headers:
            Request-Id:
              description: Identifier returned in the `Request-Id` response header.
              schema:
                type: string
                maxLength: 36
                minLength: 36
                pattern: >-
                  ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                description: Identifier returned in the `Request-Id` response header.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: HTTP5xxOutput 500 response
          headers:
            Request-Id:
              description: Identifier returned in the `Request-Id` response header.
              schema:
                type: string
                maxLength: 36
                minLength: 36
                pattern: >-
                  ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                description: Identifier returned in the `Request-Id` response header.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Character
  '/api/v1/characters/{character_id}':
    delete:
      description: Mixin attaching the standard 4xx/5xx error responses to an operation.
      operationId: DeleteCharacter
      parameters:
        - name: character_id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: DeleteCharacter 200 response
        '400':
          description: HTTP4xxOutput 400 response
          headers:
            Request-Id:
              description: Identifier returned in the `Request-Id` response header.
              schema:
                type: string
                maxLength: 36
                minLength: 36
                pattern: >-
                  ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                description: Identifier returned in the `Request-Id` response header.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: HTTP5xxOutput 500 response
          headers:
            Request-Id:
              description: Identifier returned in the `Request-Id` response header.
              schema:
                type: string
                maxLength: 36
                minLength: 36
                pattern: >-
                  ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                description: Identifier returned in the `Request-Id` response header.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Character
    get:
      description: Mixin attaching the standard 4xx/5xx error responses to an operation.
      operationId: GetCharacter
      parameters:
        - name: character_id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: GetCharacter 200 response
          headers:
            Request-Id:
              description: Identifier returned in the `Request-Id` response header.
              schema:
                type: string
                maxLength: 36
                minLength: 36
                pattern: >-
                  ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                description: Identifier returned in the `Request-Id` response header.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '400':
          description: HTTP4xxOutput 400 response
          headers:
            Request-Id:
              description: Identifier returned in the `Request-Id` response header.
              schema:
                type: string
                maxLength: 36
                minLength: 36
                pattern: >-
                  ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                description: Identifier returned in the `Request-Id` response header.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: HTTP5xxOutput 500 response
          headers:
            Request-Id:
              description: Identifier returned in the `Request-Id` response header.
              schema:
                type: string
                maxLength: 36
                minLength: 36
                pattern: >-
                  ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                description: Identifier returned in the `Request-Id` response header.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Character
    put:
      description: Mixin attaching the standard 4xx/5xx error responses to an operation.
      operationId: UpdateCharacter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCharacterReq'
        required: true
      parameters:
        - name: character_id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: UpdateCharacter 200 response
          headers:
            Request-Id:
              description: Identifier returned in the `Request-Id` response header.
              schema:
                type: string
                maxLength: 36
                minLength: 36
                pattern: >-
                  ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                description: Identifier returned in the `Request-Id` response header.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '400':
          description: HTTP4xxOutput 400 response
          headers:
            Request-Id:
              description: Identifier returned in the `Request-Id` response header.
              schema:
                type: string
                maxLength: 36
                minLength: 36
                pattern: >-
                  ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                description: Identifier returned in the `Request-Id` response header.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: HTTP5xxOutput 500 response
          headers:
            Request-Id:
              description: Identifier returned in the `Request-Id` response header.
              schema:
                type: string
                maxLength: 36
                minLength: 36
                pattern: >-
                  ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                description: Identifier returned in the `Request-Id` response header.
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
